name: clocking
description: "Clocking — pontaj cu coduri QR, grafic de lucru și rapoarte."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.0+4

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  shared_preferences: ^2.5.5
  permission_handler: ^12.0.3
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  pdf: ^3.12.0
  path_provider: ^2.1.5
  crypto: ^3.0.6

# pdf 3.12 cere archive <4.1, iar image 4.11 (folosit de pdf) are nevoie de
# archive 4.1+ — fixăm image la o versiune compatibilă.
dependency_overrides:
  image: '>=4.5.0 <4.11.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/icon/icon.png
